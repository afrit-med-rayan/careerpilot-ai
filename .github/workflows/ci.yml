name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend — lint, type-check & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt aiosqlite ruff mypy

      # Lint: fast, zero-config
      - name: Lint (ruff)
        run: ruff check app/ tests/ scripts/

      # Type-check: ignore missing stubs for third-party libs
      - name: Type-check (mypy)
        run: |
          mypy app/ \
            --ignore-missing-imports \
            --no-strict-optional \
            --disable-error-code=attr-defined \
            --disable-error-code=return-value
        continue-on-error: true   # advisory — does not block CI

      # Full test suite against in-memory SQLite
      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          JWT_SECRET: ci-test-secret-change-in-prod
          ANTHROPIC_API_KEY: ""
          STORAGE_BACKEND: local
          DEBUG_LOG_LLM: "false"
          ADZUNA_APP_ID: ""
          ADZUNA_APP_KEY: ""

      # Coverage summary (informational)
      - name: Coverage report
        run: |
          pip install pytest-cov --quiet
          pytest tests/ --cov=app --cov-report=term-missing --tb=no -q
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          JWT_SECRET: ci-test-secret-change-in-prod
          ANTHROPIC_API_KEY: ""
          STORAGE_BACKEND: local
          DEBUG_LOG_LLM: "false"
          ADZUNA_APP_ID: ""
          ADZUNA_APP_KEY: ""
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — lint, type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type-check (tsc)
        run: npx tsc --noEmit

      # Verify production build succeeds
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          # Skip telemetry in CI
          NEXT_TELEMETRY_DISABLED: "1"

  # ──────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker — compose config validate
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose config
        run: docker compose config --quiet

      - name: Build backend image
        run: docker compose build backend
        env:
          DOCKER_BUILDKIT: "1"
